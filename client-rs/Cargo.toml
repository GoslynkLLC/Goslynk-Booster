[workspace]
resolver = "2"
members = [
    "crates/gpb-protocol",
    "crates/gpb-profile",
    "crates/gpb-net",
    "crates/gpb-tunnel",
    "crates/gpb-daemon",
    "gpb-app/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license-file = "../LICENSE"
rust-version = "1.75"

[workspace.dependencies]
gpb-protocol = { path = "crates/gpb-protocol" }
gpb-profile = { path = "crates/gpb-profile" }
gpb-net = { path = "crates/gpb-net" }
gpb-tunnel = { path = "crates/gpb-tunnel" }
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
libc = "0.2"
