[package]
name = "gpb-app"
version = "0.1.2"
description = "Goslynk Booster desktop app"
authors = ["Goslynk LLC"]
edition = "2021"
license-file = "../../../LICENSE"

[lib]
name = "gpb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
gpb-protocol = { path = "../../crates/gpb-protocol" }
gpb-profile = { path = "../../crates/gpb-profile" }
gpb-net = { path = "../../crates/gpb-net" }
gpb-tunnel = { path = "../../crates/gpb-tunnel" }
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
