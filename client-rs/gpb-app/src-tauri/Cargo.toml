[package]
name = "gpb-app"
version = "0.1.0"
description = "Game Ping Booster — Tauri UI (PSK)"
authors = ["Game Ping Booster"]
edition = "2021"
license = "MIT"

[lib]
name = "gpb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
gpb-protocol = { path = "../../crates/gpb-protocol" }
gpb-profile = { path = "../../crates/gpb-profile" }
gpb-net = { path = "../../crates/gpb-net" }
gpb-tunnel = { path = "../../crates/gpb-tunnel" }
