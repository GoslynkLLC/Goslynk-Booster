name: Build apps

# Every push to main (and every v* tag) builds Windows + macOS and publishes a GitHub
# Release. The release starts as a draft so a half-finished build is never public; it is
# published once both installers are attached, and deleted if a build fails or is cancelled.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version client-rs/gpb-app/src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          notes="$(git log -1 --format='%s%n%n%b' "$GITHUB_SHA")"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            -f name="Goslynk Booster $tag" -f body="$notes" \
            -F draft=true -F prerelease=false --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            # WiX light.exe fails on the current runner image; ship the NSIS installer only.
            args: --bundles nsis
            bundle: client-rs/target/release/bundle
            artifact: Goslynk-Booster-windows-x64
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            bundle: client-rs/target/universal-apple-darwin/release/bundle
            artifact: Goslynk-Booster-macos-universal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-rs/gpb-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-rs -> target
          key: ${{ matrix.artifact }}

      # relay.local.json is gitignored (it holds the PSK); the secret pre-fills the relay in the app.
      - name: Default relay from secret
        shell: bash
        env:
          RELAY_LOCAL_JSON: ${{ secrets.RELAY_LOCAL_JSON }}
        run: |
          if [ -n "$RELAY_LOCAL_JSON" ]; then
            printf '%s' "$RELAY_LOCAL_JSON" > client-rs/gpb-app/src-tauri/relay.local.json
            echo "Default relay embedded."
          else
            echo "No default relay embedded; the app takes the relay from the Goslynk server after login."
          fi

      - name: Install frontend dependencies
        working-directory: client-rs/gpb-app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: client-rs/gpb-app
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg

  publish:
    name: Publish release
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.id }}" -X PATCH \
            -F draft=false -f make_latest=true --jq .html_url

  discard:
    name: Discard draft
    needs: [release, build]
    if: ${{ always() && needs.release.result == 'success' && needs.build.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.id }}" -X DELETE
